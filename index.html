<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Directory & Links</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Single Image Mode (when ?id=... is present) */
        body.single-mode {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body.single-mode #index-gallery {
            display: none !important;
        }
        body.single-mode #single-viewer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        body.single-mode #image-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
            outline: none;
            cursor: default;
        }
        body.single-mode #display-image {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Gallery / Directory Mode (when at root index.html) */
        body.gallery-mode {
            background-color: #090a0f;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px 80px;
            overflow-y: auto;
            display: block;
        }
        body.gallery-mode #single-viewer {
            display: none !important;
        }
        body.gallery-mode #index-gallery {
            display: block;
            max-width: 1240px;
            margin: 0 auto;
        }

        /* Gallery Header */
        .gallery-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 28px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-title-group h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .header-title-group p {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #181920;
            color: #f8fafc;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #232530;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #2563eb;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #60a5fa;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .card {
            background: #12131a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            border-color: rgba(56, 189, 248, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        /* Thumbnail Container */
        .thumb-box {
            position: relative;
            height: 180px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            text-decoration: none;
        }
        .thumb-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .thumb-box:hover img {
            transform: scale(1.04);
        }
        .thumb-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }
        .thumb-box:hover .thumb-overlay {
            opacity: 1;
        }
        .preview-badge {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Card Content */
        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 14px;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .slide-name {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }
        .slide-file {
            font-size: 0.75rem;
            color: #64748b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .url-box {
            background: #0a0a0f;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .url-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }
        .card-btn {
            padding: 8px 12px;
            font-size: 0.82rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1c24;
            color: #e2e8f0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .card-btn:hover {
            background: #252834;
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }
        .card-btn.copied {
            background: #14532d !important;
            border-color: #22c55e !important;
            color: #86efac !important;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            border: 1px solid #22c55e;
            color: #f0fdf4;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.875rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Single Clean Image Viewer -->
    <div id="single-viewer">
        <a id="image-link" href="#" target="_blank" rel="noopener noreferrer">
            <img id="display-image" src="" alt="">
        </a>
    </div>

    <!-- Index Gallery Directory -->
    <div id="index-gallery">
        <header class="gallery-header">
            <div class="header-title-group">
                <h1>Image Links Directory <span class="badge">11 Photos</span></h1>
                <p>Click any thumbnail or copy its link. Each URL opens only that image fitted on a black background with no controls.</p>
            </div>
            <div class="header-actions">
                <button id="copy-all-btn" class="btn btn-primary">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy All URLs
                </button>
            </div>
        </header>

        <div id="cards-grid" class="cards-grid">
            <!-- Dynamically populated by JS -->
        </div>
    </div>

    <div id="toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <script>
        (function() {
            const slides = [
                { index: 0,  label: "Cover / Title", id: "7b9e4a2f", name: "IMG_7b9e4a2f.png", file: "assets/Industrialisation History.png" },
                { index: 1,  label: "Slide 1",        id: "a1f8c3d5", name: "IMG_a1f8c3d5.png", file: "assets/Industrialisation History (1).png" },
                { index: 2,  label: "Slide 2",        id: "e6d2b489", name: "IMG_e6d2b489.png", file: "assets/Industrialisation History (2).png" },
                { index: 3,  label: "Slide 3",        id: "3c9a7f10", name: "IMG_3c9a7f10.png", file: "assets/Industrialisation History (3).png" },
                { index: 4,  label: "Slide 4",        id: "84e1b7c2", name: "IMG_84e1b7c2.png", file: "assets/Industrialisation History (4).png" },
                { index: 5,  label: "Slide 5",        id: "2f0d9c4e", name: "IMG_2f0d9c4e.png", file: "assets/Industrialisation History (5).png" },
                { index: 6,  label: "Slide 6",        id: "d5a83e71", name: "IMG_d5a83e71.png", file: "assets/Industrialisation History (6).png" },
                { index: 7,  label: "Slide 7",        id: "91c4b2e8", name: "IMG_91c4b2e8.png", file: "assets/Industrialisation History (7).png" },
                { index: 8,  label: "Slide 8",        id: "4e7f10d9", name: "IMG_4e7f10d9.png", file: "assets/Industrialisation History (8).png" },
                { index: 9,  label: "Slide 9",        id: "b3d82a6c", name: "IMG_b3d82a6c.png", file: "assets/Industrialisation History (9).png" },
                { index: 10, label: "Slide 10",       id: "f0c94e82", name: "IMG_f0c94e82.png", file: "assets/Industrialisation History (10).png" }
            ];

            const urlParams = new URLSearchParams(window.location.search);
            const hash = window.location.hash.replace('#', '').trim();

            let queryVal = urlParams.get('id') || 
                           urlParams.get('img') || 
                           urlParams.get('file') || 
                           urlParams.get('p') || 
                           urlParams.get('page') || 
                           urlParams.get('photo');

            // Handle "?1", "?IMG_a1f8c3d5.png", or hash
            if (!queryVal) {
                const rawSearch = window.location.search.replace('?', '').trim();
                if (rawSearch && rawSearch !== 'gallery' && rawSearch !== 'index') {
                    queryVal = rawSearch;
                }
            }
            if (!queryVal && hash && hash !== 'gallery' && hash !== 'index') {
                queryVal = hash;
            }

            // Normalization
            let normalized = (queryVal || "").trim().toLowerCase();
            normalized = normalized.replace(/\.png$/i, '');
            if (normalized.startsWith('img_')) {
                normalized = normalized.substring(4);
            }

            // Check if a specific single image was requested
            let matchedSlide = null;
            if (queryVal) {
                matchedSlide = slides.find(s => 
                    s.id.toLowerCase() === normalized ||
                    s.name.toLowerCase() === (queryVal || "").toLowerCase() ||
                    s.index.toString() === queryVal ||
                    s.file.toLowerCase().includes(queryVal.toLowerCase())
                );
                if (!matchedSlide && !isNaN(queryVal)) {
                    const idx = parseInt(queryVal, 10);
                    if (idx >= 0 && idx < slides.length) {
                        matchedSlide = slides[idx];
                    }
                }
            }

            // ROUTE 1: Single Image Mode
            if (matchedSlide) {
                document.body.className = 'single-mode';
                document.title = matchedSlide.name;

                const imgEl = document.getElementById('display-image');
                const linkEl = document.getElementById('image-link');

                imgEl.src = matchedSlide.file;
                imgEl.alt = matchedSlide.name;

                const customLink = urlParams.get('link') || urlParams.get('url');
                linkEl.href = customLink ? customLink : (matchedSlide.file + "?id=" + matchedSlide.name);

                try {
                    const cleanQuery = "?id=" + matchedSlide.name;
                    if (window.location.search !== cleanQuery && window.location.protocol.startsWith('http')) {
                        window.history.replaceState(null, matchedSlide.name, window.location.pathname + cleanQuery);
                    }
                } catch (e) {}
                return;
            }

            // ROUTE 2: Gallery Directory Mode
            document.body.className = 'gallery-mode';
            document.title = "Image Links Directory";

            const baseUrl = getBaseUrl();
            const cardsGrid = document.getElementById('cards-grid');

            // Render all slide cards
            slides.forEach(slide => {
                const fullUrl = baseUrl + '?id=' + slide.name;
                const relativeUrl = './?id=' + slide.name;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <a href="${relativeUrl}" target="_blank" class="thumb-box" title="Open ${slide.name}">
                        <img src="${slide.file}" alt="${slide.label}" loading="lazy">
                        <div class="thumb-overlay">
                            <span class="preview-badge">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                Open Clean Page
                            </span>
                        </div>
                    </a>
                    <div class="card-body">
                        <div class="card-meta">
                            <div class="slide-name">${slide.label}</div>
                            <div class="slide-file">${slide.name}</div>
                        </div>
                        <div class="url-box" title="${fullUrl}">
                            <span class="url-text">?id=${slide.name}</span>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn copy-btn" data-url="${fullUrl}">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                Copy Link
                            </button>
                            <a href="${relativeUrl}" target="_blank" class="card-btn">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                Open ↗
                            </a>
                        </div>
                    </div>
                `;
                cardsGrid.appendChild(card);
            });

            // Individual Copy buttons
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const url = this.getAttribute('data-url');
                    copyText(url, () => {
                        const originalHtml = this.innerHTML;
                        this.classList.add('copied');
                        this.innerHTML = `
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Copied!
                        `;
                        showToast('Link copied: ' + url.split('?')[1]);
                        setTimeout(() => {
                            this.classList.remove('copied');
                            this.innerHTML = originalHtml;
                        }, 2000);
                    });
                });
            });

            // Copy All URLs button
            document.getElementById('copy-all-btn').addEventListener('click', function() {
                const allLinks = slides.map(s => `${s.label}: ${baseUrl}?id=${s.name}`).join('\n');
                copyText(allLinks, () => {
                    showToast('All 11 URLs copied to clipboard!');
                });
            });

            function getBaseUrl() {
                if (window.location.protocol === 'file:') {
                    return window.location.href.split('?')[0].split('#')[0];
                }
                const origin = window.location.origin;
                const path = window.location.pathname.replace(/\/index\.html$/i, '/');
                return origin + (path.endsWith('/') ? path : path + '/');
            }

            function copyText(text, callback) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(callback).catch(() => fallbackCopy(text, callback));
                } else {
                    fallbackCopy(text, callback);
                }
            }

            function fallbackCopy(text, callback) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    if (callback) callback();
                } catch (e) {}
                document.body.removeChild(ta);
            }

            let toastTimer;
            function showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-msg').textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2400);
            }
        })();
    </script>
</body>
</html>
