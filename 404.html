<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            // Extract the requested filename or ID from the URL path
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const lastPart = pathParts.length > 0 ? pathParts[pathParts.length - 1] : '';

            // Redirect back to index.html with the id parameter
            const redirectUrl = './?id=' + encodeURIComponent(lastPart);
            window.location.replace(redirectUrl);
        })();
    </script>
</head>
<body style="background-color: #000000; margin: 0;">
</body>
</html>
